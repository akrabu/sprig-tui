[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sprig-tui"
version = "0.4.0"
description = "A Workflowy-inspired terminal outliner with native OPML files"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/akrabu/sprig-tui"
Issues = "https://github.com/akrabu/sprig-tui/issues"

[project.scripts]
sprig = "sprig.__main__:main"

[tool.setuptools]
packages = ["sprig"]
