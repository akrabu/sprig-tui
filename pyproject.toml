[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sprig-tui"
version = "0.3.0"
description = "A Workflowy-style terminal outliner with native OPML files"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["Brotli>=1.2.1,<2"]

[project.urls]
Repository = "https://github.com/akrabu/sprig-tui"
Issues = "https://github.com/akrabu/sprig-tui/issues"

[project.scripts]
sprig = "sprig.__main__:main"

[tool.setuptools]
packages = ["sprig"]
